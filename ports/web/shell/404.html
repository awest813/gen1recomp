<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>G1R Deluxe</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14181d;
      color: #eaeef5;
      font: 16px/1.45 system-ui, sans-serif;
    }
    a { color: #8eb7e8; }
  </style>
</head>
<body>
  <p>That page is not part of G1R Deluxe. <a id="home" href="./">Back to the game</a>.</p>
  <script>
    // GitHub Pages keeps the missing path in the address bar. Step up one
    // directory so /<repo>/missing and /<repo>/missing/ both return to the game.
    var home = document.getElementById("home");
    var path = location.pathname.replace(/\/+$/, "");
    var slash = path.lastIndexOf("/");
    if (slash > 0) home.setAttribute("href", path.slice(0, slash + 1));
  </script>
</body>
</html>
