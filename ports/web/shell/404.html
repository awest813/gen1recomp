<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>G1R Deluxe</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14181d;
      color: #eaeef5;
      font: 16px/1.45 system-ui, sans-serif;
    }
    a { color: #8eb7e8; }
  </style>
</head>
<body>
  <p>That page is not part of G1R Deluxe. <a id="home" href="./">Back to the game</a>.</p>
  <script>
    // GitHub Pages serves this file for a missing path and keeps the broken
    // URL in the address bar. Step up to the nearest directory that can hold
    // index.html (project sites live at /<repo>/, not at the domain root).
    var home = document.getElementById("home");
    var path = location.pathname.replace(/[^/]*$/, "");
    if (path && path !== "/") home.setAttribute("href", path);
  </script>
</body>
</html>
