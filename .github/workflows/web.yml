name: web

# Browser build (love.js): docs/proposals/web-port.md, ports/web/BUILD.md.
#
# Every run builds dist/web with scripts/build_web.sh and runs the ROM-free
# browser smoke test (headless Chromium: the page boots to the launcher with
# no Lua error and the lovejs bridge installed).  The site is uploaded as an
# artifact, so a run is playable locally with
#   python3 -m http.server -d <unzipped artifact> 8000
#
# A push to dev or main publishes the site.  Pull requests only build and
# smoke-test.  A hand-started run publishes when "deploy" is ticked.  Pages
# must be set to "GitHub Actions" once (Settings > Pages > Source).  The
# site ships engine code only -- no ROM, no generated game data; players
# import their own ROM in the browser.  --pages writes .nojekyll and a
# project-site 404, and splits game.data before it can hit Pages' 100 MiB
# file limit.  Asset URLs stay relative, so the same build works at
# /<repo>/ and at a custom domain.

on:
  push:
    branches: [dev, main]
    paths:
      - "main.lua"
      - "conf.lua"
      - "src/**"
      - "data/**"
      - "assets/**"
      - "ports/web/**"
      - "scripts/build_web.sh"
      - "scripts/patch_web_*.py"
      - "scripts/split_web_build.py"
      - "scripts/stamp_web_assets.py"
      - "scripts/prepare_pages_site.py"
      - "tests/test_patch_*.py"
      - "tests/test_split_web_build.py"
      - "scripts/pack_love.sh"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [dev]
    paths:
      - "main.lua"
      - "conf.lua"
      - "src/**"
      - "data/**"
      - "assets/**"
      - "ports/web/**"
      - "scripts/build_web.sh"
      - "scripts/patch_web_*.py"
      - "scripts/split_web_build.py"
      - "scripts/stamp_web_assets.py"
      - "scripts/prepare_pages_site.py"
      - "tests/test_patch_*.py"
      - "tests/test_split_web_build.py"
      - "scripts/pack_love.sh"
      - ".github/workflows/web.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the build to GitHub Pages"
        type: boolean
        default: false

concurrency:
  group: web-${{ github.ref }}
  # Pull requests cancel a stale run.  A push or a hand-started deploy
  # finishes, so a newer commit cannot abort a publish halfway through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build + browser smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: web runtime, mod compatibility and loader regressions
        run: |
          python3 -m venv .bazinga/web-tests
          .bazinga/web-tests/bin/python -m pip install --disable-pip-version-check -r ports/web/test-requirements.txt
          .bazinga/web-tests/bin/python -c 'from lupa.lua51 import LuaRuntime'
          .bazinga/web-tests/bin/python -m unittest discover -s tests -p 'test_patch_*.py'
          .bazinga/web-tests/bin/python -m unittest discover -s tests -p 'test_split_web_build.py'

      # emsdk 2.0.0 and the love.js build tree are the slow part (~10 min
      # cold); key on everything that changes the native output
      - name: cache emsdk and love.js build
        uses: actions/cache@v6
        with:
          path: |
            .bazinga/work/web/emsdk
            .bazinga/work/web/megasource
            .bazinga/work/web/SDL2
            .bazinga/work/web/build
            .bazinga/work/web/native-out
          key: web-native-${{ hashFiles('scripts/build_web.sh', 'ports/web/patch_love.py', 'ports/web/patch_lua.py', 'ports/web/native/**') }}
          restore-keys: web-native-

      - name: build the site
        run: ./scripts/build_web.sh --pages

      - name: install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: browser smoke (ROM-free)
        run: node ports/web/smoke_test.mjs --site dist/web --out dist/web-smoke --timeout-s 180

      - name: upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gen1recomp-web-smoke
          path: dist/web-smoke
          if-no-files-found: ignore

      - name: upload the site
        uses: actions/upload-artifact@v7
        with:
          name: gen1recomp-web
          path: dist/web

      - name: configure GitHub Pages
        if: >-
          (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
          || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        uses: actions/configure-pages@v5

      - name: upload the Pages artifact
        if: >-
          (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
          || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'))
      || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
